name: vaultwarden

services:
  vaultwarden-db:
    image: docker.io/postgres:17
    container_name: vaultwarden-db
    hostname: vaultwarden-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 120s
      timeout: 45s
      retries: 10
      start_period: 30s
    networks:
      - vaultwarden-net
    env_file:
     - /srv/CherryTech-App-Configs/podman/8001_vaultwarden/.env
    volumes:
      - /home/vaultwarden/.data/vaultwarden/vaultwarden-db:/var/lib/postgresql/data:Z
      - /home/vaultwarden/.data/vaultwarden/vaultwarden-db-backups:/var/db-backups/backups:Z
    mem_limit: 2g
    secrets:
      - vaultwarden-db-password
    security_opt:
      - no-new-privileges:true

  vaultwarden-app:
    image: docker.io/vaultwarden/server:latest
    container_name: vaultwarden-app
    hostname: vaultwarden
    restart: unless-stopped
    depends_on:
      vaultwarden-db:
        condition: service_healthy
    networks:
      - vaultwarden-net
    env_file:
     - /srv/CherryTech-App-Configs/podman/8001_vaultwarden/.env
    volumes:
      - /home/vaultwarden/.data/vaultwarden/vaultwarden-app:/data:Z
    ports:
      - "127.0.0.1:8001:80"
    healthcheck:
     test: ["CMD", "/healthcheck.sh"]
     interval: 120s
     timeout: 45s
     retries: 10
     start_period: 40s
    mem_limit: 2g
    secrets:
      - vaultwarden-db-password
    security_opt:
      - no-new-privileges:true

secrets:
  vaultwarden-db-password:
    external: true
    type: env
    target: POSTGRES_PASSWORD

networks:
  vaultwarden-net:
