name: invoice-ninja

services:
  invoiceninja-db:
    image: docker.io/library/mariadb:11
    container_name: invoiceninja-db
    hostname: invoiceninja-db
    restart: unless-stopped
    networks:
      - invoiceninja-net
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: invoiceninja
      MYSQL_USER: invoiceninja
      MYSQL_PASSWORD_FILE: /run/secrets/invoiceninja_db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/invoiceninja_db_root_password
    secrets:
      - invoiceninja_db_password
      - invoiceninja_db_root_password
    volumes:
      - invoiceninja-db:/var/lib/mysql:Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${INVOICENINJA_DB_MEMORY_LIMIT}
    cpus: ${INVOICENINJA_DB_CPU_LIMIT}

  invoiceninja-redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: invoiceninja-redis
    hostname: invoiceninja-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$(cat /run/secrets/invoiceninja_valkey_password)\" ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - invoiceninja-net
    command: >
      sh -c 'exec valkey-server
      --appendonly yes
      --requirepass "$$(cat /run/secrets/invoiceninja_valkey_password)"'
    environment:
      TZ: ${TZ}
    secrets:
      - invoiceninja_valkey_password
    volumes:
      - invoiceninja-valkey:/data:Z
    mem_limit: ${INVOICENINJA_VALKEY_MEM_LIMIT}
    cpus: ${INVOICENINJA_VALKEY_CPU_LIMIT}
    security_opt:
      - no-new-privileges:true

  invoiceninja-app:
    image: docker.io/invoiceninja/invoiceninja-debian:latest
    container_name: invoiceninja
    hostname: invoiceninja
    restart: unless-stopped
    depends_on:
      invoiceninja-db:
        condition: service_healthy
      invoiceninja-redis:
        condition: service_healthy
    networks:
      - invoiceninja-net
    ports:
      - "127.0.0.1:8004:80"
    environment:
      TZ: ${TZ}
      APP_URL: ${DOMAIN}
      APP_KEY: ${INVOICENINJA_APP_KEY}
      APP_ENV: production
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}

      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

      IN_USER_EMAIL: ${INVOICENINJA_ADMIN_EMAIL}
      IN_PASSWORD: ${INVOICENINJA_ADMIN_PASSWORD}

      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: invoiceninja
      DB_USERNAME: invoiceninja
      DB_PASSWORD: ${INVOICENINJA_DB_PASSWORD}

      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${INVOICENINJA_VALKEY_PASSWORD}

      APP_DEBUG: ${DUBUG_MODE}
      REQUIRE_HTTPS: true
      IS_DOCKER: true
      PHANTOMJS_PDF_GENERATION: false
      PDF_GENERATOR: snappdf
    healthcheck:
     test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
     interval: 30s
     timeout: 10s
     retries: 5
     start_period: 90s
    secrets:
      - invoiceninja_app_key
    volumes:
      - invoiceninja-app:/var/www/app/storage:Z
    mem_limit: ${INVOICENINJA_APP_MEMORY_LIMIT}
    cpus: ${INVOICENINJA_APP_CPU_LIMIT}

volumes:
  invoiceninja-app:
  invoiceninja-db:
  invoiceninja-valkey:

secrets:
  invoiceninja_db_password:
    external: true
  invoiceninja_db_root_password:
    external: true
  invoiceninja_valkey_password:
    external: true
  invoiceninja_app_key:
    external: true

networks:
  invoiceninja-net:
    driver: bridge
    name: invoiceninja-net
