name: nextcloud

services:
  nextcloud-db:
    image: docker.io/postgres:17-alpine
    container_name: nextcloud-db
    hostname: nextcloud-db
    restart: unless-stopped
    networks:
      - nextcloud-net
    secrets:
      - nextcloud_db_password
    volumes:
      - /home/nextcloud/.data/nextcloud/nextcloud-db:/var/lib/postgresql/data:Z
    env_file: nextcloud.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 120s
      timeout: 15s
      retries: 15
      start_period: 30s
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  nextcloud-redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: nextcloud-redis
    hostname: nextcloud-redis
    restart: unless-stopped
    networks:
      - nextcloud-net
    env_file: nextcloud.env
    volumes:
      - /home/nextcloud/.data/nextcloud/nextcloud-valkey:/data:Z
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 1g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  nextcloud-app:
    image: docker.io/nextcloud:apache
    container_name: nextcloud-app
    hostname: nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    networks:
      - nextcloud-net
    ports:
      - "127.0.0.1:8002:80"
    env_file: nextcloud.env
    healthcheck:
      test: curl -sSf 'http://localhost/status.php' | grep '"installed":true' | grep '"maintenance":false' | grep '"needsDbUpgrade":false' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - /home/nextcloud/.data/nextcloud/nextcloud-app:/var/www/html:Z
    mem_limit: 3g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true


networks:
  nextcloud-net:
    name: nextcloud-net
    driver: bridge
