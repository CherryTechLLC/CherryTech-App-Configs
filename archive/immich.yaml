name: immich

services:
  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-db
    hostname: immich-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - immich-net
    env_file: /srv/CherryTech-App-Configs/podman/8006_immich/.env
    volumes:
      - /home/immich/.data/immich/immich-db-backups:/var/db-backups/backups:Z
      - /home/immich/.data/immich/immich-db-backups:/var/lib/postgresql/data:Z
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    container_name: immich-redis
    hostname: immich-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - immich-net
    env_file: /srv/CherryTech-App-Configs/podman/8006_immich/.env
    secrets:
      - immich_valkey_password
    volumes:
      - immich-valkey:/data:Z
    command: >
      sh -c 'exec valkey-server
      --appendonly yes
      --requirepass "$$(cat /run/secrets/immich_valkey_password)"'
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true

  immich-app:
    container_name: immich-app
    hostname: immich
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      - /mnt/immich:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '127.0.0.1:8006:2283'
    env_file: /srv/CherryTech-App-Configs/podman/8006_immich/.env
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    restart: always
    healthcheck:
      disable: false
    mem_limit: 3g
    security_opt:
      - no-new-privileges:true

  immich-machine-learning:
    container_name: immich_machine_learning
    hostname: immich-machine-learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # immich tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - immich-model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true

networks:
  immich-net:
    name: immich-net
    driver: bridge
